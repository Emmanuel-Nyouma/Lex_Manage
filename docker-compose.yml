services:
  # Static SPA served by nginx, which also reverse-proxies /api and /socket.io
  # to the backend so the whole app is one origin (no CORS, WS upgrade handled).
  # FRONTEND_PUBLIC_URL is this frontend's own public origin (where browsers reach
  # it) — Vite bakes it in at build time. Defaults to http://localhost for a local
  # `docker compose up`. For a separate backend domain, point VITE_API_URL/VITE_WS_URL
  # at the backend instead and drop the proxy blocks in nginx.conf.
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${FRONTEND_PUBLIC_URL:-http://localhost}
        VITE_WS_URL: ${FRONTEND_PUBLIC_URL:-http://localhost}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    container_name: lex-manage-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./lexmanage-backend
      dockerfile: Dockerfile
    container_name: lex-manage-backend
    restart: always
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY}
      NODE_ENV: ${NODE_ENV:-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      PORT: ${PORT:-3001}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-lexmanage-documents}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-AES256}
      S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_TLS: ${REDIS_TLS:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-onboarding@resend.dev}
      N8N_RAG_CHAT_URL: ${N8N_RAG_CHAT_URL:-}
      N8N_RAG_INGEST_URL: ${N8N_RAG_INGEST_URL:-}
      N8N_RAG_DELETE_URL: ${N8N_RAG_DELETE_URL:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-730}
      MALWARE_SCAN_MODE: ${MALWARE_SCAN_MODE:-required}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:-30000}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT:-3001}/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    command: >
      sh -c "npx prisma migrate deploy && node dist/main"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: lex-manage-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lexmanage}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lexmanage}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: lex-manage-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: lex-manage-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?MINIO_KMS_SECRET_KEY is required}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:1.4
    container_name: lex-manage-clamav
    restart: always
    environment:
      CLAMD_CONF_MaxScanSize: 50M
      CLAMD_CONF_MaxFileSize: 50M
      CLAMD_CONF_StreamMaxLength: 50M
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:
